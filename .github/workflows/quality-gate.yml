name: quality-gate

# PR 门禁：只跑「本次改动影响到」的部分。
#   - 合并到 pre-prod / main：一律全量（这两个分支是发布口径，不进增量）
#   - 全量兜底另见 nightly-full-gate.yml（定时 + 手动）
# 判断口径与本地 `pnpm gate:quick`（scripts/gate.mjs）保持一致：
# 命中构建/工具链改动（package.json / lock / scripts / .github）时按全量跑。

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── 分类器：判断本次 PR 影响到哪些范围 ────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      sources: ${{ steps.classify.outputs.sources }}
      frontend: ${{ steps.classify.outputs.frontend }}
      server: ${{ steps.classify.outputs.server }}
      workspace: ${{ steps.classify.outputs.workspace }}
      contract: ${{ steps.classify.outputs.contract }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE" >/dev/null 2>&1 || true
          if git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR "HEAD~1...HEAD" || true)
          fi
          echo "改动文件："
          printf '%s\n' "$FILES"

          has() { [ -n "$FILES" ] && printf '%s\n' "$FILES" | grep -qE "$1"; }
          yes_no() { if "$@"; then echo true; else echo false; fi; }

          FRONTEND=$(yes_no has '^apps/frontend/')
          SERVER=$(yes_no has '^apps/server/')
          CLI=$(yes_no has '^apps/cli/')
          SHARED=$(yes_no has '^packages/apm-shared/')
          GLOBAL=$(yes_no has '^(package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|turbo\.json|scripts/|\.github/)')
          CONTRACT=$(yes_no has '^(openapi\.json|apps/server/src/|packages/apm-shared/src/)')
          DOCS=$(yes_no has '^(docs/|AGENTS\.md|README\.md|CHANGELOG\.md)')

          if [ "$BASE" = "pre-prod" ] || [ "$BASE" = "main" ]; then FULL=true; else FULL=false; fi

          SOURCES=false
          if [ "$FRONTEND" = true ] || [ "$SERVER" = true ] || [ "$CLI" = true ] || [ "$SHARED" = true ] || [ "$GLOBAL" = true ]; then SOURCES=true; fi
          if [ "$CLI" = true ] || [ "$SHARED" = true ] || [ "$GLOBAL" = true ]; then WORKSPACE=true; else WORKSPACE=false; fi

          # 全量分支：所有范围都置真
          if [ "$FULL" = true ]; then
            FRONTEND=true; SERVER=true; WORKSPACE=true; CONTRACT=true; DOCS=true; SOURCES=true
          fi
          # 工具链改动：任何测试都可能被影响，按全量跑
          if [ "$GLOBAL" = true ]; then
            FRONTEND=true; SERVER=true; WORKSPACE=true; CONTRACT=true; DOCS=true
          fi

          {
            echo "full=$FULL"
            echo "sources=$SOURCES"
            echo "frontend=$FRONTEND"
            echo "server=$SERVER"
            echo "workspace=$WORKSPACE"
            echo "contract=$CONTRACT"
            echo "docs=$DOCS"
          } >> "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - run: pnpm type-check

  lint:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vitest --changed 需要基线 ref
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 前端单测（受影响文件）
        if: needs.changes.outputs.full != 'true'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          pnpm --filter "./apps/frontend" exec vitest run --changed "$BASE"
      - name: 前端单测（全量）
        if: needs.changes.outputs.full == 'true'
        run: pnpm --filter "./apps/frontend" run test

  test-backend:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - name: server 单测（受影响文件）
        if: needs.changes.outputs.full != 'true'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          pnpm --filter "./apps/server" exec vitest run --changed "$BASE"
      - name: server 单测（全量）
        if: needs.changes.outputs.full == 'true'
        run: pnpm --filter "./apps/server" run test

  # 补盲区：apps/cli 与 packages/apm-shared 的单测此前在 CI 中从未被执行
  test-workspace:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/apm-shared" run test
      - run: pnpm --filter "./apps/cli" run test

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - name: contract:check（导出 openapi 需启动 AppModule，注入 CI 专用 env）
        env:
          DATABASE_URL: file:${{ github.workspace }}/apps/server/prisma/ci-contract.db
          JWT_SECRET: ci-contract-secret
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: pnpm contract:check
      - run: pnpm check:contract-convention

  e2e-backend:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - name: 准备 CI 数据库（默认库 schema + 工作区模板库）
        working-directory: apps/server
        run: |
          DATABASE_URL="file:${{ github.workspace }}/apps/server/prisma/ci-dev.db" \
            pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm run build:template-db
      - name: 决定 e2e 范围（改动模块 → 受影响套件；不确定则全量）
        id: scope
        env:
          GATE_BASE: origin/${{ github.base_ref }}
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            echo "specs=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          echo "specs=$(node scripts/gate.mjs --e2e-specs | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Run e2e（全量）
        if: steps.scope.outputs.specs == 'ALL'
        working-directory: apps/server
        env:
          DATABASE_URL: file:${{ github.workspace }}/apps/server/prisma/ci-dev.db
          JWT_SECRET: ci-e2e-secret
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: pnpm run test:e2e
      - name: Run e2e（受影响套件）
        if: steps.scope.outputs.specs != 'ALL'
        working-directory: apps/server
        env:
          DATABASE_URL: file:${{ github.workspace }}/apps/server/prisma/ci-dev.db
          JWT_SECRET: ci-e2e-secret
          INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          SPECS="${{ steps.scope.outputs.specs }}"
          if [ "$SPECS" = "NONE" ] || [ -z "$SPECS" ]; then
            echo "本次改动未命中任何 server 源码路径，跳过 e2e"
            exit 0
          fi
          pnpm run test:e2e -- $SPECS

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs-sync
      - run: pnpm check:doc-coverage
      - run: pnpm check:i18n-sync
