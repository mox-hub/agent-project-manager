name: quality-gate

on:
  pull_request:
    branches: ["*"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter "./apps/server" run prisma:generate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm -r lint

      - name: Frontend tests
        run: pnpm --filter "./apps/frontend" run test --run

      - name: Backend tests
        run: pnpm --filter "./apps/server" run test --runInBand

      - name: Docs sync check
        run: pnpm check:docs-sync

      - name: Doc coverage check
        run: pnpm check:doc-coverage
