name: quality-gate

on:
  pull_request:
    branches: ["*"]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - run: pnpm type-check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/frontend" run test

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - run: pnpm --filter "./apps/server" run test

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - name: contract:check（导出 openapi 需启动 AppModule，注入 CI 专用 env）
        env:
          DATABASE_URL: file:${{ github.workspace }}/apps/server/prisma/ci-contract.db
          JWT_SECRET: ci-contract-secret
        run: pnpm contract:check
      - run: pnpm check:contract-convention

  e2e-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./apps/server" run prisma:generate
      - name: 准备 CI 数据库（默认库 schema + 工作区模板库）
        working-directory: apps/server
        run: |
          DATABASE_URL="file:${{ github.workspace }}/apps/server/prisma/ci-dev.db" \
            pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm run build:template-db
      - name: Run e2e
        working-directory: apps/server
        env:
          DATABASE_URL: file:${{ github.workspace }}/apps/server/prisma/ci-dev.db
          JWT_SECRET: ci-e2e-secret
        run: pnpm run test:e2e --runInBand --forceExit

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs-sync
      - run: pnpm check:doc-coverage
      - run: pnpm check:i18n-sync
