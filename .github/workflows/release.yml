name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 v0.4.1-beta.2)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter "./apps/server" exec prisma generate
        env:
          DATABASE_URL: file:./dev.db

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm -r lint

      - name: Frontend tests
        run: pnpm --filter "./apps/frontend" run test --run

      - name: Backend tests
        run: pnpm --filter "./apps/server" run test --runInBand

      - name: Build frontend
        run: pnpm --filter "./apps/frontend" run build

      - name: Build server
        run: pnpm --filter "./apps/server" run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_VERSION }}
          releaseName: "AgentPM ${{ env.RELEASE_VERSION }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri build
