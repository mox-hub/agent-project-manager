<!doctype html>
<!-- Lieflat Charts · B2 hairline line 参数化单图（CAP-C-06 图表双引擎切片 2026-09-30）
     骨架/几何/动画节奏遵 basics-gallery.html B2 真实实现：日历地板发丝 + 发丝折线(draw)
     + 逐点圆点(pop stagger) + top-2 峰值放大标数。数据由宿主以 __CHART_DATA__ 注入，
     未注入时回落演示数据。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .stage{width:100%;max-width:860px}
  h2{font-weight:700;font-size:16px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  svg{width:100%;max-height:min(64vh,560px);display:block;margin:0 auto}
  svg text{font-family:'Inter',system-ui,sans-serif}
  .src{margin-top:14px;font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--faint)}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <h2 id="t"></h2>
  <div class="sub" id="s"></div>
  <svg id="chart" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="src" id="src"></div>
</div>
<script>
// ── Lieflat mono tokens（与 basics-gallery 同源内联）──
const INK = '#1C1C1A', PAPER = '#F0EFEB', MUTED = '#8F8E88', GRID = '#DEDDD6';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); p.appendChild(n); return n; };
const txt = (p, a, s) => { const n = el(p, 'text', a); n.textContent = s; return n; };
const tip = (n, s) => { const t = document.createElementNS(NS, 'title'); t.textContent = s; n.appendChild(t); };
const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;
const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) { go(); io.disconnect(); } }, { threshold: .3 });
  io.observe(n); n.style.cursor = 'pointer'; n.addEventListener('click', go);
};

// 宿主注入槽：srcDoc 渲染时替换为 JSON 字面量；未注入时回落演示数据
const CHART_DATA = /*__CHART_DATA__*/null;

const DEMO = {
  title: '健康分，八周走势',
  sub: '一点 = 一周 · 刻度 0-100 · 点击图重播',
  src: 'HEALTH HAIRLINE · LIEFLAT · DEMO',
  max: 100,
  points: [
    { label: 'W1', value: 72 }, { label: 'W2', value: 75 },
    { label: 'W3', value: 71 }, { label: 'W4', value: 78 },
    { label: 'W5', value: 74 }, { label: 'W6', value: 80 },
    { label: 'W7', value: 79 }, { label: 'W8', value: 83 },
  ],
};
const D = CHART_DATA && Array.isArray(CHART_DATA.points) && CHART_DATA.points.length ? CHART_DATA : DEMO;

document.getElementById('t').textContent = D.title;
document.getElementById('s').textContent = D.sub;
document.getElementById('src').textContent = D.src;

obsReveal('chart', (s) => {
  const P = D.points, N = P.length, max = D.max || 100;
  const base = 262, topY = 34;
  const step = N > 1 ? (372 - 34) / (N - 1) : 0;
  const x = (d) => (N > 1 ? 34 + d * step : 200);
  const map = (v) => base - (Math.max(0, Math.min(max, v)) / max) * (base - topY);
  // 日历地板：每点一根发丝，无论分数高低
  for (let d = 0; d < N; d++) {
    el(s, 'line', { x1: x(d), y1: base, x2: x(d), y2: base - 7, stroke: '#CFCEC7', 'stroke-width': .6, class: 'fade', style: 'animation-delay:' + (d * .02) + 's' });
  }
  el(s, 'line', { x1: 24, y1: base, x2: 376, y2: base, stroke: GRID, 'stroke-width': .8, class: 'fade' });
  const vs = P.map((p) => p.value);
  // top-2 峰值（间隔至少一点，避免并排重复标注）
  const topPk = [];
  for (const d of [...vs.keys()].sort((a, b) => vs[b] - vs[a])) {
    if (topPk.every((t) => Math.abs(t - d) >= 1)) topPk.push(d);
    if (topPk.length === 2) break;
  }
  // 发丝折线
  const pts = vs.map((v, d) => x(d) + ' ' + map(v)).join(' L ');
  el(s, 'path', { d: 'M' + pts, fill: 'none', stroke: INK, 'stroke-width': 1, pathLength: 1, class: 'draw', style: 'animation-duration:1.2s' });
  vs.forEach((v, d) => {
    const big = topPk.includes(d);
    const dot = el(s, 'circle', { cx: x(d), cy: map(v), r: big ? 4.2 : 2.4, fill: INK, class: 'pop', style: 'animation-delay:' + (.2 + d * .06) + 's' });
    tip(dot, P[d].label + ' — ' + v + ' 分');
    if (big) {
      txt(s, { x: x(d), y: map(v) - 11, 'font-size': 9.5, 'font-weight': 800, fill: INK, 'text-anchor': 'middle', style: 'paint-order:stroke;stroke:' + PAPER + ';stroke-width:3px;animation-delay:' + (1 + d * .01) + 's', class: 'fade' }, v);
    }
  });
  // 轴标签：首 / 中 / 尾（去重）
  const mid = Math.floor((N - 1) / 2);
  [[0, P[0].label], [mid, P[mid].label], [N - 1, P[N - 1].label]]
    .filter((it, i, arr) => i === 0 || it[0] !== arr[i - 1][0])
    .forEach(([d, m]) => {
      txt(s, { x: x(d), y: base + 18, 'font-size': 8, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle', 'letter-spacing': '.1em', class: 'fade' }, m);
    });
  txt(s, { x: 200, y: 306, 'font-size': 7, 'font-weight': 600, fill: '#B0AFA9', 'text-anchor': 'middle', 'letter-spacing': '.12em', class: 'fade', style: 'animation-delay:1.1s' }, 'ONE DOT = ONE POINT · SCALE 0-' + max);
});
</script>
</body>
</html>
