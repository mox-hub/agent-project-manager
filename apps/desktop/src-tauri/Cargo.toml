[package]
name = "agent-project-manager-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Agent Project Manager Team"]
description = "Agent Project Manager Desktop Shell (Tauri)"

[lib]
name = "agent_project_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rust_version = "0.4"
dirs = "5"
