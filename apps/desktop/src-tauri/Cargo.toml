[package]
name = "agent-project-manager-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Agent Project Manager Team"]
description = "Agent Project Manager Desktop Shell (Tauri)"

[lib]
name = "agent_project_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rustc_version = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
