packages:
  - "apps/*"
  - "packages/*"
catalog:
  eslint: ^9.39.5
  eslint-config-prettier: ^9.1.2
  eslint-plugin-prettier: ^5.5.6
  globals: ^16.5.0
  prettier: ^3.9.6
  typescript: ^5.9.3
  typescript-eslint: ^8.68.0
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msw: true
  prisma: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.49'
  - '@ai-sdk/gateway@4.0.73'
  - '@ai-sdk/google@4.0.63'
  - '@ai-sdk/openai@4.0.57'
  - ai@7.0.91
  - '@mastra/core@1.65.0'
  - '@mastra/libsql@1.22.4'
  - '@mastra/schema-compat@1.3.9'
