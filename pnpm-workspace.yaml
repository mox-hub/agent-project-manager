packages:
  - "apps/*"
  - "packages/*"
# 禁用脚本运行前的依赖自检自动安装：NODE_ENV=production 场景（如桌面壳打包链 pack.mjs）
# 会触发根目录 `pnpm install --prod` 并要求清空 node_modules，破坏开发环境
verifyDepsBeforeRun: false
catalog:
  '@vitest/coverage-v8': 5.0.0
  '@vitest/ui': 5.0.0
  eslint: ^9.39.5
  eslint-config-prettier: ^9.1.2
  eslint-plugin-prettier: ^5.5.6
  globals: ^16.5.0
  prettier: ^3.9.6
  typescript: ^5.9.3
  typescript-eslint: ^8.68.0
  vitest: 5.0.0
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  prisma: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.49'
  - '@ai-sdk/gateway@4.0.73'
  - '@ai-sdk/google@4.0.63'
  - '@ai-sdk/openai@4.0.57'
  - ai@7.0.91
  - '@mastra/core@1.65.0'
  - '@mastra/libsql@1.22.4'
  - '@mastra/schema-compat@1.3.9'
# jest-dom matchers 对 vitest 5 Assertion 的类型增强：vitest 5 将 Assertion
# 移入内部 chunk 且 'vitest' 顶层为 re-export 别名，jest-dom@6.10 对 'vitest'
# 的模块增强静默失效（339 个 TS2339）。此 patch 在真实声明模块上追加 extends。
# vitest 升级时 patch 会因 hash 失效需重新生成（chunk 文件名含内容 hash）。
patchedDependencies:
  'vitest@5.0.0': patches/vitest@5.0.0.patch
